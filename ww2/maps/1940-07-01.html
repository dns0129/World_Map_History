/* Layout: a full-window staff map; date tabs across the top, a control sheet on the left,
   country / province details on the right (bottom sheet on phones). */
:root {
  --paper: #eceeea;      /* chart paper */
  --sheet: #f8f9f6;      /* panels */
  --ink: #1b2220;
  --ink-2: #4f5955;
  --muted: #7d8681;
  --rule: #cdd3ce;
  --sea: #d3dde2;
  --land: #e4e3dc;
  --allied: #2a78d6;
  --axis: #eb6834;
  --contested: #1baf7a;
  --neutral: #b8b5a8;
  --focus: #2a78d6;
  --river: #4f86b4;
  --river-ink: #2f6797;
  --label-ink: rgb(22 24 26 / 0.78);
  --label-halo: rgb(255 255 255 / 0.42);
  --shadow: 0 1px 2px rgb(20 30 28 / 0.08), 0 6px 18px rgb(20 30 28 / 0.10);
  --f-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151b1d; --sheet: #1d2427; --ink: #eef1ee; --ink-2: #c1c8c4; --muted: #8b958f; --rule: #34403f;
    --sea: #10181d; --land: #232b2c; --allied: #3987e5; --axis: #d95926; --contested: #199e70; --neutral: #5a5f5a;
    --focus: #6aa9f0; --river: #5d93c2; --river-ink: #2c5f8c; --label-ink: rgb(14 16 18 / 0.85); --label-halo: rgb(255 255 255 / 0.30);
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151b1d; --sheet: #1d2427; --ink: #eef1ee; --ink-2: #c1c8c4; --muted: #8b958f; --rule: #34403f;
  --sea: #10181d; --land: #232b2c; --allied: #3987e5; --axis: #d95926; --contested: #199e70; --neutral: #5a5f5a;
  --focus: #6aa9f0; --river: #5d93c2; --river-ink: #2c5f8c; --label-ink: rgb(14 16 18 / 0.85); --label-halo: rgb(255 255 255 / 0.30);
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.35); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--f-body); overflow: hidden; }
.app { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
header.bar {
  min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  padding: 10px 16px; background: var(--sheet); border-bottom: 1px solid var(--rule); z-index: 3;
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { margin: 0; font: 700 18px/1.2 var(--f-display); letter-spacing: 0.02em; text-wrap: balance; }
.brand small { color: var(--muted); font: 12px/1.3 var(--f-body); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; flex: 1 1 520px; min-width: 0; }
nav.tabs button {
  flex: 0 0 auto; border: 1px solid var(--rule); background: transparent; color: var(--ink-2);
  border-radius: 6px; padding: 5px 10px 6px; cursor: pointer; text-align: left; font: inherit;
}
nav.tabs button .d { display: block; font: 500 13px/1.2 var(--f-mono); color: var(--ink); }
nav.tabs button .t { display: block; font-size: 11.5px; line-height: 1.3; max-width: 13em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav.tabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
nav.tabs button[aria-selected="true"] .d { color: var(--sheet); }
button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
#map { position: absolute; inset: 0; background: var(--sea); }
.stage { position: relative; min-height: 0; }
.sheet {
  position: absolute; z-index: 2; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 12px;
  max-height: calc(100% - 24px); overflow: auto;
}
.controls { left: 12px; top: 12px; width: 300px; }
.detail { right: 12px; top: 12px; width: 330px; }
.sheet h2 { margin: 0; font: 600 15px/1.35 var(--f-display); text-wrap: balance; }
.sheet h3 { margin: 0 0 6px; font: 500 11px/1.2 var(--f-body); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.lede { margin: 0; color: var(--ink-2); font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink-2); padding: 6px 2px; font: 500 12.5px var(--f-body); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.legend { display: flex; flex-direction: column; gap: 4px; }
.legend .row { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 8px; font-size: 13px; }
.legend button.row { border: 0; background: transparent; color: inherit; font: inherit; text-align: left; padding: 2px 4px; margin: 0 -4px; border-radius: 4px; cursor: pointer; }
.legend button.row:hover { background: var(--paper); }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgb(0 0 0 / 0.15); box-sizing: border-box; }
.num { font: 12px var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar-split { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--rule); }
.bar-split span { display: block; height: 100%; }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 13px; }
.toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; border-radius: 4px; }
.search { position: relative; }
.search input {
  width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 7px;
  background: var(--paper); color: var(--ink); font: 13px var(--f-body);
}
.results { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; }
.results button, .list button {
  width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 4px 6px;
  border-radius: 5px; cursor: pointer; font: 13px var(--f-body); display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
}
.results button:hover, .list button:hover { background: var(--paper); }
.results .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { display: block; }
.list .who { display: flex; align-items: center; gap: 6px; min-width: 0; }
.list .who span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .cur { background: var(--paper); }
dl.kv { display: grid; grid-template-columns: 6.5em 1fr; gap: 5px 10px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--rule); color: var(--ink-2); }
.chip.hist { border-color: var(--allied); color: var(--allied); }
.chip.approx { border-style: dashed; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12.5px; color: var(--muted); padding-right: 24px; }
.crumbs button { border: 0; background: transparent; color: var(--focus); font: inherit; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.crumbs .here { color: var(--ink-2); }
.title { display: flex; align-items: center; gap: 8px; }
.title .sw { width: 16px; height: 16px; flex: none; }
.foot { color: var(--muted); font-size: 11.5px; margin: 0; }
.close { position: absolute; top: 8px; right: 8px; border: 0; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; }
.tip {
  position: absolute; z-index: 4; pointer-events: none; background: var(--sheet); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; box-shadow: var(--shadow);
  font-size: 12.5px; line-height: 1.4; max-width: 260px;
}
.tip b { font-weight: 700; }
.tip .num { display: block; }
#labels, #curves { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
#curves { width: 100%; height: 100%; }
.lbl { position: absolute; pointer-events: none; transform: translate(-50%, -50%);
  font: 600 12px/1.15 var(--f-display); color: var(--ink); white-space: nowrap;
  text-shadow: 0 0 3px var(--paper), 0 0 3px var(--paper), 0 0 2px var(--paper); }
.lbl.small { font: 500 11px/1.1 var(--f-body); color: var(--ink-2); }
.lbl.prov { font: 500 11px/1.1 var(--f-body); color: rgb(18 20 22 / 0.9); text-shadow: 0 0 3px rgb(255 255 255 / 0.8), 0 0 2px rgb(255 255 255 / 0.8), 0 0 1px rgb(255 255 255 / 0.9); }
#curves text { font-family: var(--f-display); font-weight: 900; fill: var(--label-ink); stroke: var(--label-halo); stroke-width: 2px; paint-order: stroke; }
#curves text.river { font: italic 500 11.5px var(--f-body); fill: var(--river-ink); stroke: rgb(255 255 255 / 0.75); stroke-width: 2.5px; stroke-linejoin: round; letter-spacing: 0.15em; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; background: var(--paper); color: var(--ink-2); font: 14px var(--f-body); }
.loading[hidden] { display: none; }
.toggle-sheet { display: none; white-space: nowrap; flex: none; cursor: pointer; background: transparent; font: inherit; font-size: 12px; }
@media (max-width: 760px) {
  .brand small { display: none; }
  .controls { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 46%; }
  .controls.collapsed > :not(.toggle-sheet):not(.head) { display: none; }
  .detail { left: 8px; right: 8px; top: 8px; width: auto; max-height: 42%; }
  .toggle-sheet { display: inline-block; }
}
.busy #map { cursor: progress; }
.busy nav.tabs button[aria-selected="true"] .d::after { content: " · 绘制中"; font-family: var(--f-body); font-size: 11px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">

      <p class="foot">点击地图先选中国家，在同一国家内再点一次即进入省级。每个断面只显示当日施行的省级区划；当时的县、地区都已并入所属的省。没有省级资料的地方显示整个国家或殖民地。数据：OpenHistoricalMap、Newberry 美国县界史、中研院台湾 1930、国史编纂委员会 1914–26、K. Lawson 东亚图层、CShapes 2.0、Natural Earth；人口为 GHS-POP 推算。</p>
    </aside>
    <aside class="sheet detail" id="detail" hidden aria-live="polite"></aside>
    <div class="tip" id="tip" hidden></div>
    <div class="loading" id="loading">正在载入历史省级区划…</div>
  </div>
</div>

<script>
const DEFAULT_SNAPSHOT = "1940-07-01";
const MODES = ["bloc", "control", "density", "tier"];
const BLOCS = ["allied", "axis", "neutral", "contested"];
const BLOC_ZH = { allied: "同盟国一方", axis: "轴心国一方", neutral: "中立 / 维希", contested: "前线争夺" };
const STATUS_ZH = { independent: "独立国", colony: "殖民地", protectorate: "保护国", mandate: "委任统治地", occupied: "被占领地区", "N/A": "—" };
const TYPE_ZH = {
  independent: "本国统治", colony: "殖民统治", protectorate: "保护国", mandate: "委任统治", occupied: "军事占领",
  military_occupation: "军事占领", annexation: "吞并", partition: "瓜分", client_state: "傀儡 / 附庸政权",
  collaborationist_state: "合作政权（维希）", allied_occupation: "盟军占领", front_line: "前线争夺", besieged: "被围",
  resistance_base: "抗日根据地", leased_territory: "租借地", surrendering_forces: "待受降", defense_agreement: "按防务协定驻军",
  free_french: "自由法国", satellite_state: "卫星国", liberated: "已解放", military_intervention: "军事干预", "N/A": "—"
};
const TIER = { 3: ["省级", "#3f9a83"], 4: ["大区级（无省级资料）", "#a9d2bd"], 5: ["整个国家 / 殖民地（无下级资料）", "#d8cfbd"], 6: ["岛屿属地", "#e2b65b"] };
const BASIS_ZH = {
  historical_dated: "历史界线（按施行日期）", ohm_dated: "历史界线（OpenHistoricalMap，按施行日期）",
  historical_1930: "历史界线（1930）", historical_1931: "历史界线（1931）", historical_1935: "历史界线（1935）",
  historical_1939: "历史界线（1939）", historical_1940: "历史界线（1940）", historical_1941: "历史界线（1941）",
  historical_1928_1945: "历史界线（1928–1945）", reconstructed_1914_1926: "据 1914–26 年地点资料重建",
  present_day_outline_same_unit: "当时的单位，轮廓取自今日数据（界线基本未变）", historical_unit: "当日的国家 / 殖民地轮廓",
  merged_subunits: "由当时的下级区划合并而成（外界即这些区划的历史界线）"
};
const DENSITY_STEPS = [5, 25, 50, 100, 250, 500];
const DENSITY_RAMP = ["#e8f0fa", "#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95"];

const state = { snap: null, mode: "bloc", data: {}, geo: null, adminGeo: null, units: null, ctrl: null, admin: null,
  hydro: null, hydroDetail: null, sel: null, hover: null, taken: [] };
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmt = (n) => n >= 1e8 ? (n / 1e8).toFixed(2) + " 亿" : n >= 1e4 ? (n / 1e4).toFixed(n >= 1e6 ? 0 : 1) + " 万" : String(Math.round(n));
const km2 = (a) => Math.round(a).toLocaleString() + " km²";
const cssVar = (k) => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

function decodeGeo(buf) {
  const b = new Uint8Array(buf); let i = 0; const out = [];
  const v = () => { let r = 0, s = 0, c; do { c = b[i++]; r += (c & 0x7f) * 2 ** s; s += 7; } while (c & 0x80); return r; };
  const z = () => { const n = v(); return (n % 2) ? -(n + 1) / 2 : n / 2; };
  while (i < b.length) {
    const np = v(); const polys = []; let px = 0, py = 0;
    for (let p = 0; p < np; p++) {
      const nr = v(); const rings = [];
      for (let r = 0; r < nr; r++) {
        const n = v(); const ring = new Array(n + 1);
        for (let k = 0; k < n; k++) { px += z(); py += z(); ring[k] = [px / 1000, py / 1000]; }
        ring[n] = ring[0]; rings.push(ring);
      }
      polys.push(rings);
    }
    out.push(polys);
  }
  return out;
}

async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }
async function getBin(u) {
  // geometry is binary; where only text files can be served it ships as <name>.b64.txt
  const r = await fetch(u).catch(() => null);
  if (r && r.ok) return r.arrayBuffer();
  const t = await fetch(u.replace(/\.bin$/, ".b64.txt"));
  if (!t.ok) throw new Error(u + " " + t.status);
  const s = atob((await t.text()).trim()); const a = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a.buffer;
}

function col(name, ai) { const c = state.admin.cols[name]; return c.lut[c.idx[ai]]; }
function adminName(ai) { return col("name_zh", ai) || col("name", ai); }
function kindLabel(ai) {
  const k = col("kind", ai); if (!k) return null;
  const m = /^admin_level (\d)$/.exec(k); return m ? `第 ${m[1]} 级行政区（OpenHistoricalMap 分级）` : k;
}
const sdNow = () => state.data[state.snap];
const L = (sd, c, k) => sd.luts[c][sd.rows[c][k]];
const country = (sd, ci) => { const c = sd.countries[ci]; return { key: c[0], zh: c[1], en: c[2], color: c[3], bloc: c[4], pop: c[5], area: c[6], nprov: c[7], geo: c[8], comp: c[9] }; };
// the "country" of a piece in the current view: the controlling country, or the political unit
function unitKey(sd, k) { return sd.unit[k] >= 0 ? sd.unit[k] : 100000 + sd.rows.unit_name_zh[k]; }
function countryOf(sd, k, mode = state.mode) { return mode === "control" ? sd.country[k] : unitKey(sd, k); }
const countryProp = (mode = state.mode) => mode === "control" ? "c" : "u";

function densityClass(pop, area) {
  const d = area > 0 ? pop / area : 0; let k = 0; while (k < DENSITY_STEPS.length && d >= DENSITY_STEPS[k]) k++; return k;
}

function buildFeatures(sd) {
  const feats = new Array(sd.feature.length);
  for (let k = 0; k < sd.feature.length; k++) {
    const f = sd.feature[k]; const ai = state.admin.feature_admin[f]; const ci = sd.country[k];
    const contested = sd.countries[ci][0] === "-20";
    feats[k] = { type: "Feature", id: k, geometry: { type: "MultiPolygon", coordinates: state.geo[f] },
      properties: { b: sd.bloc[k], a: sd.conf[k], t: state.admin.tier[ai], p: ai, c: ci, u: unitKey(sd, k),
        h: contested ? 2 : sd.conf[k], col: sd.countries[ci][3], d: densityClass(sd.pop[k], sd.area[k]) } };
  }
  return { type: "FeatureCollection", features: feats };
}
const fc = (features) => ({ type: "FeatureCollection", features });
const adminFeatures = (sd) => fc(sd.admin_active.map((a) => ({ type: "Feature", id: a,
  geometry: { type: "MultiPolygon", coordinates: state.adminGeo[a] }, properties: { t: state.admin.tier[a] } })));
const unitFeatures = (sd) => fc(sd.units_active.map((u) => ({ type: "Feature", id: u,
  geometry: { type: "MultiPolygon", coordinates: state.units[u] }, properties: {} })));
const ctrlFeatures = (sd) => fc(sd.countries.map((c, ci) => ({ type: "Feature", id: ci,
  geometry: { type: "MultiPolygon", coordinates: state.ctrl[c[8]] }, properties: { k: c[0] } })));

// ------------------------------------------------------------------ paint
function fillColor() {
  const A = cssVar("--allied"), X = cssVar("--axis"), C = cssVar("--contested"), N = cssVar("--neutral");
  if (state.mode === "bloc") return ["match", ["get", "b"], 0, A, 1, X, 3, C, N];
  if (state.mode === "control") return ["get", "col"];
  if (state.mode === "tier") return ["match", ["get", "t"], 3, TIER[3][1], 4, TIER[4][1], 6, TIER[6][1], TIER[5][1]];
  const r = DENSITY_RAMP;
  return ["match", ["get", "d"], 0, r[0], 1, r[1], 2, r[2], 3, r[3], 4, r[4], 5, r[5], r[6]];
}
function fillOpacity() {
  const base = state.mode === "control" ? 0.88 : 0.72; const s = state.sel;
  if (!s) return base;
  const inC = ["==", ["get", countryProp()], s.country];
  if (s.level === "province") return ["case", ["==", ["get", "p"], s.admin], 0.97, inC, base, base * 0.35];
  return ["case", inC, Math.min(0.95, base + 0.06), base * 0.35];
}
function hatchFilter() {
  const none = ["==", ["get", "a"], -1];
  if (!$("tApprox").checked) return none;
  if (state.mode === "bloc") return ["==", ["get", "a"], 1];
  if (state.mode === "control") return [">=", ["get", "h"], 1];
  return none;
}
function applyPaint() {
  map.setPaintProperty("prov-fill", "fill-color", fillColor());
  map.setPaintProperty("prov-fill", "fill-opacity", fillOpacity());
  map.setFilter("prov-approx", hatchFilter());
  const ctl = state.mode === "control", on = $("tBorders").checked;
  map.setLayoutProperty("ctrl-line", "visibility", ctl && on ? "visible" : "none");
  map.setLayoutProperty("unit-line", "visibility", !ctl && on ? "visible" : "none");
  const s = state.sel; const none = ["==", ["id"], -1];
  map.setFilter("ctrl-sel", s && ctl ? ["==", ["id"], s.country] : none);
  map.setFilter("unit-sel", s && !ctl && s.country < 100000 ? ["==", ["id"], s.country] : none);
  map.setFilter("prov-sel", s && s.level === "province" ? ["==", ["id"], s.admin] : none);
}

// ------------------------------------------------------------------ legend
function legend() {
  const sd = sdNow(); const Lg = $("legend"); Lg.replaceChildren(); const sp = $("split"); sp.replaceChildren(); sp.hidden = true;
  const row = (color, label, val, onclick, hatch) => {
    const r = el(onclick ? "button" : "div", "row"); if (onclick) { r.type = "button"; r.onclick = onclick; }
    const s = el("span", "sw"); s.style.background = hatch ? `repeating-linear-gradient(135deg, ${color} 0 3px, rgb(0 0 0 / 0.35) 3px 4px)` : color;
    r.append(s, el("span", null, label), el("span", "num", val ?? "")); Lg.append(r);
  };
  const note = $("legendNote"); note.hidden = false;
  if (state.mode === "bloc") {
    $("legendTitle").textContent = "实际控制阵营 · 人口";
    const total = Object.values(sd.bloc_pop).reduce((a, b) => a + b, 0);
    for (const [k, v] of [["allied", "--allied"], ["axis", "--axis"], ["contested", "--contested"], ["neutral", "--neutral"]]) {

// ------------------------------------------------------------------ labels
let map;
function overlap(r) { return state.taken.some((t) => !(r[2] < t[0] || r[0] > t[2] || r[3] < t[1] || r[1] > t[3])); }

function quadLen(p0, p1, p2) {

  for (let i = 1; i <= 12; i++) { const t = i / 12, a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
    const q = [a * p0[0] + b * p1[0] + c * p2[0], a * p0[1] + b * p1[1] + c * p2[1]]; len += Math.hypot(q[0] - prev[0], q[1] - prev[1]); prev = q; }

}

function curvedText(id, d, text, cls, size, spacing) {

  const path = document.createElementNS(NS, "path"); path.setAttribute("id", id); path.setAttribute("d", d); $("curveDefs").append(path);
  const t = document.createElementNS(NS, "text"); if (cls) t.setAttribute("class", cls);
  if (size) t.setAttribute("font-size", size.toFixed(1));
  if (spacing != null) t.setAttribute("letter-spacing", spacing.toFixed(1));
  const tp = document.createElementNS(NS, "textPath"); tp.setAttribute("href", "#" + id); tp.setAttribute("startOffset", "50%");
  tp.setAttribute("text-anchor", "middle"); tp.textContent = text; t.append(tp); $("curveText").append(t);
}

function countryLabels(W, H) {
  const sd = sdNow(); const z = map.getZoom(); const scale = 2 ** z; let n = 0;
  for (const [ci, x0, y0, x1, y1, x2, y2, s0] of sd.country_labels) {
    // large territories keep a capped size and spread their letters along the line instead
    const raw = s0 * scale; if (raw < 9 || raw > 300) continue; const fs = Math.min(raw, 64);
    const name = sd.countries[ci][1];
    const p0 = map.project([x0, y0]), p1 = map.project([x1, y1]), p2 = map.project([x2, y2]);
    const minx = Math.min(p0.x, p2.x, p1.x), maxx = Math.max(p0.x, p2.x, p1.x), miny = Math.min(p0.y, p2.y, p1.y), maxy = Math.max(p0.y, p2.y, p1.y);
    if (maxx < -50 || minx > W + 50 || maxy < -50 || miny > H + 50) continue;
    const len = quadLen([p0.x, p0.y], [p1.x, p1.y], [p2.x, p2.y]); const chars = [...name].length;
    const spacing = chars > 1 ? Math.max(0, (len * 0.94 - chars * fs) / (chars - 1)) : 0;
    curvedText("cl" + n++, `M${p0.x.toFixed(1)},${p0.y.toFixed(1)} Q${p1.x.toFixed(1)},${p1.y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`, name, null, fs, spacing);
    state.taken.push([minx - fs * 0.2, miny - fs * 0.6, maxx + fs * 0.2, maxy + fs * 0.6]);

}

function riverLabels(W, H) {
  const z = map.getZoom(); if (z < 3.6 || !$("tHydro").checked) return;
  const maxRank = z < 4.5 ? 4 : z < 5.5 ? 6 : z < 6.5 ? 8 : 12;
  const b = map.getBounds(); let placed = 0; const seen = new Set();
  const feats = [...state.hydro.features, ...(state.hydroDetail && z >= 5 ? state.hydroDetail.features : [])];
  const cand = [];
  for (const f of feats) {
    const p = f.properties; if (p.k !== "r" || !p.n || p.c || p.r > maxRank) continue;
    const bb = f._bb || (f._bb = bbox(f.geometry));
    if (bb[2] < b.getWest() || bb[0] > b.getEast() || bb[3] < b.getSouth() || bb[1] > b.getNorth()) continue;
    cand.push(f);
  }
  cand.sort((a, c) => a.properties.r - c.properties.r);
  for (const f of cand) {
    if (placed >= 40) break; const name = f.properties.n; if (seen.has(name)) continue;
    const lines = f.geometry.type === "LineString" ? [f.geometry.coordinates] : f.geometry.coordinates;
    let best = null;
    for (const line of lines) {
      let run = [], len = 0;
      const flush = () => { if (run.length > 1 && (!best || len > best.len)) best = { pts: run, len }; run = []; len = 0; };
      for (const c of line) { const q = map.project(c);
        if (q.x < 0 || q.y < 0 || q.x > W || q.y > H) { flush(); continue; }
        if (run.length) len += Math.hypot(q.x - run[run.length - 1].x, q.y - run[run.length - 1].y); run.push(q); }
      flush();
    }
    const need = [...name].length * 13 + 40; if (!best || best.len < need) continue;
    // take the middle stretch of the visible run, just long enough for the name
    const pts = best.pts; const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
    const a = (best.len - need) / 2, e = a + need; let seg = pts.filter((q, i) => cum[i] >= a && cum[i] <= e);
    if (seg.length < 2) seg = pts;
    if (seg[seg.length - 1].x < seg[0].x) seg = seg.slice().reverse();
    const xs = seg.map((q) => q.x), ys = seg.map((q) => q.y);
    const r = [Math.min(...xs) - 6, Math.min(...ys) - 8, Math.max(...xs) + 6, Math.max(...ys) + 8];
    if (overlap(r)) continue;
    state.taken.push(r); seen.add(name); placed++;
    curvedText("rl" + placed, "M" + seg.map((q) => q.x.toFixed(1) + "," + q.y.toFixed(1)).join(" L"), name, "river");
  }
}

function bbox(g) {

  const walk = (c) => { if (typeof c[0] === "number") { x0 = Math.min(x0, c[0]); x1 = Math.max(x1, c[0]); y0 = Math.min(y0, c[1]); y1 = Math.max(y1, c[1]); } else c.forEach(walk); };

}

function placeLabels() {
  const box = $("labels"); box.replaceChildren(); $("curveDefs").replaceChildren(); $("curveText").replaceChildren(); state.taken = [];
  if (!$("tLabels").checked || !state.snap) return;
  const z = map.getZoom(); const sd = sdNow();
  const W = map.getContainer().clientWidth, H = map.getContainer().clientHeight;
  const put = (name, x, y, cls, cw) => {
    const p = map.project([x, y]); if (p.x < 0 || p.y < 0 || p.x > W || p.y > H) return;
    const w = Math.min([...name].length, 14) * cw + 6, h = cls ? 14 : 16; const r = [p.x - w / 2, p.y - h / 2, p.x + w / 2, p.y + h / 2];

  }
}

function onClick(k) {

// ------------------------------------------------------------------ snapshots, views
function setHash() { try { history.replaceState(null, "", "#" + state.snap + (state.mode !== "bloc" ? "/" + state.mode : "")); } catch (e) {} }

  const prev = state.sel && state.data[state.snap] ? { admin: state.sel.admin, level: state.sel.level } : null;
  state.snap = snap; const sd = sdNow();

  }

  const n = sd.admin_active.length; const split = new Set(sd.feature.filter((f, k) => sd.split[k]).map((f) => state.admin.feature_admin[f])).size;
  const top = sd.countries.filter((c) => c[0] !== "-20").slice(0, 3).map((c) => `${c[1]} ${fmt(c[5])}`).join("、");
  $("snapLede").textContent = `当日施行的省级区划 ${n.toLocaleString()} 个，其中 ${split} 个被国界或战线切开。人口最多的实际控制者：${top}。`;

function setMode(mode) {

function addPattern() {
  const c = document.createElement("canvas"); c.width = c.height = 8; const g = c.getContext("2d");
  g.strokeStyle = "rgba(20,25,24,0.45)"; g.lineWidth = 1.2; g.beginPath(); g.moveTo(-2, 10); g.lineTo(10, -2); g.moveTo(-2, 2); g.lineTo(2, -2); g.moveTo(6, 10); g.lineTo(10, 6); g.stroke();

async function boot() {
  const [index, admin, geo, adminGeo, units, ctrl, hydro] = await Promise.all([getJSON("data/index.json"), getJSON("data/admin.json"),
    getBin("data/geo.bin"), getBin("data/geo-admin.bin"), getBin("data/geo-units.bin"), getBin("data/geo-ctrl.bin"), getJSON("data/hydro.json")]);
  state.admin = admin; state.geo = decodeGeo(geo); state.adminGeo = decodeGeo(adminGeo); state.units = decodeGeo(units);
  state.ctrl = decodeGeo(ctrl); state.hydro = hydro;
  const tabs = $("tabs");
  for (const s of index.snapshots) {
    const b = el("button"); b.type = "button"; b.role = "tab"; b.dataset.snap = s.snapshot;
    b.append(el("span", "d", s.snapshot.replace(/-/g, ".")), el("span", "t", s.title_zh));
    b.onclick = () => loadSnap(s.snapshot); tabs.append(b);
  }
  map = new maplibregl.Map({ container: "map", center: [60, 30], zoom: 1.6, minZoom: 1, maxZoom: 11, attributionControl: false,
    renderWorldCopies: false, style: { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": cssVar("--sea") } }] } });
  if (window.innerWidth > 760) map.setPadding({ left: 320, top: 0, right: 0, bottom: 0 });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
  map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-left");

const R = (lo, mid, hi, rest) => ["case", ["<=", ["get", "r"], 3], lo, ["<=", ["get", "r"], 6], mid, ["<=", ["get", "r"], 8], hi, rest];

    "line-width": ["interpolate", ["linear"], ["zoom"], 1, R(0.8, 0.4, 0.25, 0.2), 4, R(1.7, 1.0, 0.65, 0.45), 8, R(3.2, 2.2, 1.5, 1.0)],

async function onLoad(index) {

  const [start, view] = (location.hash || "").slice(1).split("/");

  await loadSnap(index.snapshots.some((s) => s.snapshot === start) ? start : DEFAULT_SNAPSHOT);

async function loadDetailHydro() {
  if (state.hydroDetail || state.hydroLoading || map.getZoom() < 4.3) return;
  state.hydroLoading = true;
  try {
    state.hydroDetail = await getJSON("data/hydro-detail.json");
    map.addSource("hydro2", { type: "geojson", data: state.hydroDetail });
    map.addLayer({ id: "hydro2-fill", type: "fill", source: "hydro2", minzoom: 4.3, filter: ["==", ["get", "k"], "l"], paint: { "fill-color": cssVar("--sea") } }, "prov-line");
    map.addLayer({ id: "hydro2-line", type: "line", source: "hydro2", minzoom: 4.3, filter: ["all", ["==", ["get", "k"], "r"], ["!=", ["get", "c"], 1]],
      layout: { "line-cap": "round", "line-join": "round", visibility: $("tHydro").checked ? "visible" : "none" }, paint: riverPaint() }, "prov-line");
    if (!$("tHydro").checked) map.setLayoutProperty("hydro2-fill", "visibility", "none");

function wire(admin) {
  map.on("mousemove", "prov-fill", (e) => {
    const f = e.features[0]; if (!f) return; map.getCanvas().style.cursor = "pointer";
    if (state.hover !== null && state.hover !== f.id) map.setFeatureState({ source: "prov", id: state.hover }, { hov: false });
    state.hover = f.id; map.setFeatureState({ source: "prov", id: f.id }, { hov: true }); showTip(e, f.id);
  });
  map.on("mouseleave", "prov-fill", () => { map.getCanvas().style.cursor = ""; $("tip").hidden = true;
    if (state.hover !== null) map.setFeatureState({ source: "prov", id: state.hover }, { hov: false }); state.hover = null; });
  map.on("click", (e) => {
    const f = map.queryRenderedFeatures(e.point, { layers: ["prov-fill"] })[0];
    if (f) onClick(f.id); else if (state.sel) clearSelection();
  });
  let pending = false; map.on("move", () => { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; placeLabels(); }); });
  map.on("moveend", placeLabels);

  for (const b of document.querySelectorAll(".seg button")) b.onclick = () => setMode(b.dataset.mode);
  const vis = (id, layers) => $(id).onchange = () => layers.forEach((l) => map.getLayer(l) && map.setLayoutProperty(l, "visibility", $(id).checked ? "visible" : "none"));
  vis("tProv", ["prov-line"]); vis("tTerrain", ["terrain"]);
  $("tHydro").onchange = () => { for (const l of ["hydro-fill", "hydro-line", "hydro2-fill", "hydro2-line"]) if (map.getLayer(l)) map.setLayoutProperty(l, "visibility", $("tHydro").checked ? "visible" : "none"); placeLabels(); };
  $("tBorders").onchange = applyPaint; $("tApprox").onchange = applyPaint; $("tLabels").onchange = placeLabels;
  if (window.innerWidth <= 760) { $("controls").classList.add("collapsed"); $("toggleSheet").textContent = "展开"; $("toggleSheet").setAttribute("aria-expanded", "false"); }
  $("toggleSheet").onclick = () => { const c = $("controls"); const cl = c.classList.toggle("collapsed"); $("toggleSheet").textContent = cl ? "展开" : "收起"; $("toggleSheet").setAttribute("aria-expanded", String(!cl)); };

  const names = admin.admin_id.map((_, ai) => [ai, col("name_zh", ai) || "", (col("name", ai) || "").toLowerCase(), (col("name_en", ai) || "").toLowerCase()]);
  $("q").oninput = () => {
    const q = $("q").value.trim().toLowerCase(); const Rs = $("results"); Rs.replaceChildren(); if (q.length < 1) return;
    const qs = [...new Set([q, q.replace(/台/g, "臺"), q.replace(/臺/g, "台")])];
    const rank = (t) => { let r = 9; if (!t) return r; for (const v of qs) r = Math.min(r, t === v ? 0 : t.startsWith(v) ? 1 : t.includes(v) ? 2 : 9); return r; };
    const sd = sdNow(); const live = new Set(sd.admin_active); const hits = [];
    for (const [ai, zh, nm, en] of names) { const r = Math.min(rank(zh), rank(nm), rank(en)); if (r < 9) hits.push([r + (live.has(ai) ? 0 : 5), (zh || nm).length, ai]); }
    hits.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const seen = new Set();
    for (const [, , ai] of hits) {
      const key = adminName(ai) + "|" + (col("parent", ai) || ""); if (seen.has(key)) continue; seen.add(key); if (seen.size > 8) break;
      const li = el("li"); const b = el("button"); b.type = "button";
      b.append(el("span", null, adminName(ai)), el("span", "meta", [TIER[admin.tier[ai]][0].replace(/（.*）/, ""), col("parent_zh", ai) || col("parent", ai), live.has(ai) ? null : "本断面不存在"].filter(Boolean).join(" · ")));
      b.onclick = () => { const sd2 = sdNow(); const k = sd2.feature.findIndex((f) => admin.feature_admin[f] === ai);
        if (k >= 0) selectProvince(k, true); else { const [x, y] = admin.label[ai]; map.flyTo({ center: [x, y], zoom: Math.max(map.getZoom(), 5) }); } };
      li.append(b); Rs.append(li);
    }
  };

  const retheme = () => { if (!map || !map.getLayer("prov-hover") || !state.snap) return; map.setPaintProperty("bg", "background-color", cssVar("--sea"));
    for (const l of ["hydro-fill", "hydro2-fill"]) if (map.getLayer(l)) map.setPaintProperty(l, "fill-color", cssVar("--sea"));
    for (const l of ["hydro-line", "hydro2-line"]) if (map.getLayer(l)) map.setPaintProperty(l, "line-color", cssVar("--river"));
    for (const l of ["unit-line", "prov-hover", "ctrl-sel", "unit-sel", "prov-sel"]) map.setPaintProperty(l, "line-color", cssVar("--ink"));
    map.setPaintProperty("prov-line", "line-color", cssVar("--ink-2")); applyPaint(); legend(); };
  mq.addEventListener?.("change", retheme);

}

    "https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"];
